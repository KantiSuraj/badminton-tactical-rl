# Provenance of third-party code and data used by this project. Update on every re-pin.
# Rule: one fork of CoachAI+ is the executable baseline; everything else is a separate preprocessing
# dependency or a reference. Never copy folders between repositories.

coachai_plus:                       # THE baseline environment (report reference [1])
  repo: https://github.com/KuangDW/CoachAI-Plus
  pinned_commit: 4fd05934f172eec16c74d05c2902983b64c8521e      # 2025-01-28 "updated"
  your_fork: TODO https://github.com/<your-github-user>/CoachAI-Plus
  license: >
    NONE FOUND. No LICENSE file and no licence statement in the README, so by default all rights are
    reserved. Ask the authors (NYCU Advanced Database System Lab, Prof. Wen-Chih Peng) for permission or a
    licence before redistributing or publishing modified copies. Not legal advice.
  python_env: {python: 3.10.12, torch: 2.4.1 (cu121), numpy: 1.26.4, pandas: 2.2.3, scikit-learn: 1.5.2, scipy: 1.14.1}
  how_it_runs: "NOT as upstream documents. Use scripts/setup/run_coachai_baseline.py (adds the fork root and BadmintonEnv/ to sys.path, chdir to the fork root, torch.load defaults to CPU without a GPU)."
  verified_run: {where: "Linux sandbox, Python 3.12, CPU only, pinned packages", result: "5 rallies, 25 stroke rows, 5.4 s", not_tested: "WSL2, Python 3.10, GPU"}
  known_issues:
    - "python -m BadmintonEnv.RunEnv fails: Environment.py does `from Utils...` (needs BadmintonEnv/ on sys.path; the authors' own api/app.py appends it)"
    - "requires ./ as working directory (relative paths to input_data/ and BadmintonEnv/Agent/)"
    - "hyperparameters.pkl and INV_weight.pth are CUDA-saved and loaded without map_location: crashes on machines where PyTorch sees no GPU"
    - "environment.yaml is a Linux conda lock (hundreds of pins); the pip list in requirements-coachai.txt is the subset the code imports"
  api_warning: "NOT Gymnasium. reset() -> (state, info, done, launch). step(action, is_launch) returns a 4-tuple (state, info, done, launch) on the opponent-launch path (is_launch=True, used by reset) and a 5-tuple (state, reward, info, done, launch) on the normal path. Read from Environment.py lines 122-283, not yet run."
  audited_facts:
    - "no physics terms (gravity/drag/velocity/speed/reaction/acceleration/flight) found in BadmintonEnv/*.py; transitions are constraints + learned opponents"
    - "hitter-referenced court frame: 960 x 355 units, hitter always at negative y, (0,0) at court centre; 330 units to the back line (about 2.03 cm/unit)"
  bundled_files:
      BadmintonEnv/Agent/RallyNet_weight.trc: {bytes: 369928, sha256: bed1f112d542903a5c6db898f56a0e6baf3d240abe2879041cc092805e985c7d}
      BadmintonEnv/Agent/BC_weight.pth: {bytes: 29466, sha256: a99b4a78de714716166ceb794c3e54998201cd7df35777ed318603b969a3e997}
      BadmintonEnv/Agent/BC4Serve_weight.pth: {bytes: 20632, sha256: 8036be9ccf012174a51ded00689d494b530f01249ea28ce4e7dceb93653be344}
      BadmintonEnv/Agent/INV_weight.pth: {bytes: 45850, sha256: ae9d0e1837c3515c3507172b060e82808e83840938313523509438d56eff3c60}
      BadmintonEnv/Agent/hyperparameters.pkl: {bytes: 26602443, sha256: 7e5ab372205f5b37db450e519040bdb358136e4c2b66461a1374b50c43588c7d}
      input_data/target_players_ids.pkl: {bytes: 508, sha256: b6c2e4ea5b58923d20c1a7b51a0ee6f8d83a2958d622183995c271222f51e755}

