
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "badminton-tactical-rl"
version = "0.1.0"
description = "Badminton tactical reinforcement learning research project"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
include = ["badminton_rl*"]
